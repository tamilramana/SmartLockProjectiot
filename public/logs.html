<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logs — SmartLock</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<!-- Font Awesome 6 Free CDN (Primary) -->
<link rel="stylesheet" 
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
  integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" 
  crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Font Awesome 6 Free CDN (Backup) -->
<link rel="stylesheet" 
  href="https://use.fontawesome.com/releases/v6.4.0/css/all.css" 
  crossorigin="anonymous">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
  background-size: 400% 400%;
  animation: gradient 15s ease infinite;
  min-height: 100vh;
  padding: 32px 20px;
  margin: 0;
}

.fas, .far, .fab, .fa {
  font-family: "Font Awesome 6 Free" !important;
  font-weight: 900;
  -webkit-font-smoothing: antialiased;
  display: inline-block;
  font-style: normal;
  font-variant: normal;
  text-rendering: auto;
  line-height: 1;
}

@keyframes gradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.wrap {
  max-width: 1000px;
  margin: 0 auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 16px;
  flex-wrap: wrap;
}

.top a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  transition: opacity 0.3s ease;
}

.top a:hover {
  opacity: 0.8;
}

.controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.search {
  padding: 12px 14px;
  border-radius: 10px;
  border: 2px solid #e5e7eb;
  background: rgba(255, 255, 255, 0.95);
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  transition: all 0.3s ease;
  color: #000000;
  width: 320px;
}

.search::placeholder {
  color: #64748b;
}

.search:focus {
  outline: none;
  border-color: #667eea;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

button {
  padding: 12px 16px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
  font-family: 'Inter', sans-serif;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.box {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  padding: 24px;
  border-radius: 15px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.box h3 {
  font-size: 22px;
  font-weight: 700;
  color: #000000;
  margin-top: 0;
  margin-bottom: 16px;
  font-family: 'Poppins', sans-serif;
}

.log {
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
  margin-bottom: 12px;
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  transition: all 0.3s ease;
  background: #fafafa;
}

.log:hover {
  border-color: #667eea;
  background: #f5f7ff;
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
}

.log .left {
  max-width: 85%;
}

.meta {
  color: #64748b;
  font-size: 12px;
  margin-bottom: 6px;
  font-weight: 500;
}

.log-actions button {
  padding: 8px 12px;
  font-size: 12px;
  margin: 0;
}

.muted-small {
  color: #64748b;
  font-size: 13px;
  text-align: center;
  padding: 20px;
}

@media (max-width: 768px) {
  .top {
    flex-direction: column;
    align-items: stretch;
  }

  .controls {
    flex-direction: column;
  }

  .search {
    width: 100%;
  }

  body {
    padding: 20px 12px;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><a href="/index.html">← Dashboard</a></div>
    <div class="controls">
      <input id="search" class="search" placeholder="Search logs (action, user, device)..." oninput="applySearch()" />
      <button onclick="exportLogs()">Export</button>
      <button onclick="logout()">Sign out</button>
    </div>
  </div>

  <div class="box">
    <h3 style="margin-top:0">Activity Logs</h3>
    <div id="logsArea"></div>
    <div id="noLogs" class="muted-small" style="display:none">No logs found.</div>
  </div>
</div>

<script>
const api = location.origin;
let token = localStorage.getItem('sl_token'); if(!token) location.href='/login.html';
function auth(){ const h={'Content-Type':'application/json'}; if(token) h['Authorization']='Bearer '+token; return h; }

let logsCache = [];
async function load(){
  const res = await fetch(api + '/logs', { headers: auth() });
  if (res.status === 401) { location.href = '/login.html'; return; }
  logsCache = await res.json();
  render(logsCache);
}

function render(list){
  const el = document.getElementById('logsArea');
  el.innerHTML = '';
  if(!list.length){ document.getElementById('noLogs').style.display='block'; return; } else { document.getElementById('noLogs').style.display='none'; }
  list.forEach(l=>{
    const d = document.createElement('div'); d.className='log';
    const who = l.user || l.userId || 'system';
    d.innerHTML = `<div class="left"><div class="meta">${new Date(l.timestamp).toLocaleString()} • ${who}</div><div style="font-weight:700">${escape(l.action)} ${l.deviceId?('• '+escape(l.deviceId)) : ''}</div></div><div class="log-actions"><button onclick="copyLog('${encodeURIComponent(JSON.stringify(l))}')">Copy</button></div>`;
    el.appendChild(d);
  });
}
function escape(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function applySearch(){
  const q = (document.getElementById('search').value || '').toLowerCase().trim();
  if(!q) return render(logsCache);
  const filtered = logsCache.filter(l => (l.action||'').toLowerCase().includes(q) || ((l.user||l.userId||'')).toLowerCase().includes(q) || (l.deviceId||'').toLowerCase().includes(q));
  render(filtered);
}

function copyLog(encoded){
  const txt = decodeURIComponent(encoded);
  navigator.clipboard?.writeText(txt).then(()=> alert('Copied')).catch(()=>alert('Copy failed'));
}

function exportLogs(){
  const blob = new Blob([JSON.stringify(logsCache, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'smartlock-logs.json'; a.click(); URL.revokeObjectURL(url);
}

function logout(){ localStorage.removeItem('sl_token'); location.href='/login.html'; }

load();
</script>
</body>
</html>
