<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SmartLock — Users</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f2f5; color: #222; }
    nav {
      background: #0f3460; color: #fff; padding: 0 24px;
      display: flex; align-items: center; justify-content: space-between; height: 56px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    nav .brand { font-size: 1.3rem; font-weight: 700; text-decoration: none; color: #fff; }
    nav .links a { color: #ccd; text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
    nav .links a:hover, nav .links a.active { color: #fff; }
    nav .user { font-size: 0.85rem; color: #aac; margin-left: 20px; }
    nav .logout { background: #e74c3c; border: none; color: #fff; padding: 6px 14px;
      border-radius: 6px; cursor: pointer; font-size: 0.85rem; margin-left: 12px; }
    nav .logout:hover { background: #c0392b; }
    .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
    h2 { margin-bottom: 20px; color: #0f3460; }
    .section { background: #fff; border-radius: 12px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07); margin-bottom: 24px; }
    .section h3 { margin-bottom: 16px; color: #333; font-size: 1.05rem; }
    .btn { padding: 9px 18px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-primary { background: #0f3460; color: #fff; }
    .btn-primary:hover { background: #16213e; }
    .btn-danger { background: #e74c3c; color: #fff; }
    .btn-danger:hover { background: #c0392b; }
    .btn-warning { background: #f39c12; color: #fff; }
    .btn-warning:hover { background: #d68910; }
    .btn-sm { padding: 5px 12px; font-size: 0.82rem; }
    label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #555; font-weight: 600; }
    input, select { width: 100%; padding: 9px 12px; border: 1.5px solid #ddd;
      border-radius: 8px; font-size: 0.95rem; margin-bottom: 14px; }
    input:focus, select:focus { outline: none; border-color: #0f3460; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    th { background: #f8f9fa; color: #555; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 0.78rem; font-weight: 600; }
    .badge-admin { background: #e8eaf6; color: #3949ab; }
    .badge-user { background: #f5f5f5; color: #555; }
    .loading { text-align: center; padding: 30px; color: #999; }
    .empty { text-align: center; padding: 20px; color: #bbb; font-style: italic; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
      align-items: center; justify-content: center; z-index: 100; }
    .modal-overlay.open { display: flex; }
    .modal { background: #fff; border-radius: 12px; padding: 28px;
      width: 100%; max-width: 400px; box-shadow: 0 8px 40px rgba(0,0,0,0.25); }
    .modal h3 { margin-bottom: 18px; color: #0f3460; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
    .toast { position: fixed; bottom: 24px; right: 24px; background: #323232; color: #fff;
      padding: 12px 20px; border-radius: 8px; font-size: 0.9rem; z-index: 200; display: none; }
    .mfa-badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; }
    .mfa-on { background: #e8f5e9; color: #27ae60; }
    .mfa-off { background: #f5f5f5; color: #aaa; }
  </style>
</head>
<body>
<nav>
  <a class="brand" href="/index.html">🔒 SmartLock</a>
  <div class="links">
    <a href="/index.html">Dashboard</a>
    <a href="/devices.html">Devices</a>
    <a href="/notifications.html">Notifications</a>
    <a href="/logs.html">Logs</a>
    <a href="/schedules.html">Schedules</a>
    <a href="/users.html" class="active" id="usersLink">Users</a>
  </div>
  <div style="display:flex;align-items:center">
    <span class="user" id="userDisplay"></span>
    <button class="logout" id="logoutBtn">Logout</button>
  </div>
</nav>
<div class="container">
  <h2>User Management</h2>

  <div class="section">
    <h3>Add New User</h3>
    <div class="form-row">
      <div>
        <label>Username</label>
        <input type="text" id="newUsername" placeholder="Username" />
      </div>
      <div>
        <label>Password</label>
        <input type="password" id="newPassword" placeholder="Password" />
      </div>
    </div>
    <div class="form-row" style="margin-top:-8px">
      <div>
        <label>Role</label>
        <select id="newRole">
          <option value="user">User</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div style="display:flex;align-items:flex-end;padding-bottom:14px">
        <button class="btn btn-primary" style="width:100%" id="addUserBtn">+ Add User</button>
      </div>
    </div>
  </div>

  <div class="section">
    <h3>All Users</h3>
    <div id="usersList" class="loading">Loading…</div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h3>Edit User: <span id="editUsername"></span></h3>
    <label>New Password (leave blank to keep current)</label>
    <input type="password" id="editPassword" placeholder="New password…" />
    <label>Role</label>
    <select id="editRole">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>
    <div class="modal-actions">
      <button class="btn" style="background:#eee;color:#333" id="cancelModalBtn">Cancel</button>
      <button class="btn btn-primary" id="saveUserBtn">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<script>
  const token = localStorage.getItem('token');
  const role = localStorage.getItem('role');
  const username = localStorage.getItem('username');
  if (!token) { window.location.href = '/login.html'; }
  if (role !== 'admin') { window.location.href = '/index.html'; }

  document.getElementById('userDisplay').textContent = username ? `👤 ${username}` : '';

  function logout() { localStorage.clear(); window.location.href = '/login.html'; }
  function authHeaders() { return { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }; }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2500);
  }

  let editingUsername = null;

  async function loadUsers() {
    document.getElementById('usersList').innerHTML = '<div class="loading">Loading…</div>';
    try {
      const res = await fetch('/api/users', { headers: authHeaders() });
      if (res.status === 401) { logout(); return; }
      const users = await res.json();
      if (!users.length) {
        document.getElementById('usersList').innerHTML = '<div class="empty">No users found.</div>';
        return;
      }
      let html = '<table><thead><tr><th>Username</th><th>Role</th><th>MFA</th><th>Created</th><th>Actions</th></tr></thead><tbody>';
      users.forEach(u => {
        const roleCls = u.role === 'admin' ? 'badge-admin' : 'badge-user';
        const mfaCls = u.mfa_enabled ? 'mfa-on' : 'mfa-off';
        const mfaText = u.mfa_enabled ? '2FA ON' : '2FA OFF';
        html += `<tr>
          <td><strong>${escText(u.username)}</strong></td>
          <td><span class="badge ${roleCls}">${escText(u.role.toUpperCase())}</span></td>
          <td><span class="mfa-badge ${mfaCls}">${escText(mfaText)}</span></td>
          <td>${u.created_at ? new Date(u.created_at).toLocaleDateString() : '—'}</td>
          <td>
            <button class="btn btn-warning btn-sm" data-action="edit" data-username="${escAttr(u.username)}" data-role="${escAttr(u.role)}">Edit</button>
            <button class="btn btn-danger btn-sm" style="margin-left:6px" data-action="delete" data-username="${escAttr(u.username)}" ${u.username === username ? 'disabled title="Cannot delete yourself"' : ''}>Delete</button>
          </td>
        </tr>`;
      });
      html += '</tbody></table>';
      document.getElementById('usersList').innerHTML = html;
    } catch (e) {
      document.getElementById('usersList').innerHTML = '<div class="empty">Error loading users.</div>';
    }
  }

  async function addUser() {
    const newUsername = document.getElementById('newUsername').value.trim();
    const password = document.getElementById('newPassword').value;
    const newRole = document.getElementById('newRole').value;
    if (!newUsername || !password) { alert('Username and password are required.'); return; }
    const res = await fetch('/api/users', {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ username: newUsername, password, role: newRole })
    });
    const data = await res.json();
    if (data.success) {
      document.getElementById('newUsername').value = '';
      document.getElementById('newPassword').value = '';
      showToast('User added ✅');
      loadUsers();
    } else {
      alert('Error: ' + (data.error || 'Unknown'));
    }
  }

  function openEdit(uname, urole) {
    editingUsername = uname;
    document.getElementById('editUsername').textContent = uname;
    document.getElementById('editPassword').value = '';
    document.getElementById('editRole').value = urole;
    document.getElementById('modal').classList.add('open');
  }

  function closeModal() { document.getElementById('modal').classList.remove('open'); }

  async function saveUser() {
    const password = document.getElementById('editPassword').value;
    const newRole = document.getElementById('editRole').value;
    const body = { role: newRole };
    if (password) body.password = password;
    const res = await fetch(`/users/${editingUsername}`, { method: 'PUT', headers: authHeaders(), body: JSON.stringify(body) });
    const data = await res.json();
    if (data.success) { showToast('User updated ✅'); closeModal(); loadUsers(); }
    else alert('Error: ' + (data.error || 'Unknown'));
  }

  async function deleteUser(uname) {
    if (!confirm(`Delete user "${uname}"? This cannot be undone.`)) return;
    const res = await fetch(`/users/${uname}`, { method: 'DELETE', headers: authHeaders() });
    const data = await res.json();
    if (data.success) { showToast('User deleted.'); loadUsers(); }
    else alert('Error: ' + (data.error || 'Unknown'));
  }

  function escText(s) {
    const div = document.createElement('div');
    div.textContent = String(s);
    return div.innerHTML;
  }

  function escAttr(s) {
    return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('logoutBtn').addEventListener('click', logout);
  document.getElementById('addUserBtn').addEventListener('click', addUser);
  document.getElementById('cancelModalBtn').addEventListener('click', closeModal);
  document.getElementById('saveUserBtn').addEventListener('click', saveUser);

  document.getElementById('modal').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modal')) closeModal();
  });

  document.getElementById('usersList').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action][data-username]');
    if (!btn || btn.disabled) return;
    const { action, username: uname, role: urole } = btn.dataset;
    if (action === 'edit') openEdit(uname, urole || 'user');
    else if (action === 'delete') deleteUser(uname);
  });

  loadUsers();
</script>
</body>
</html>
