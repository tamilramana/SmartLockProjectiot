<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — SmartLock</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
  background-size: 400% 400%;
  animation: gradient 15s ease infinite;
  min-height: 100vh;
  padding: 32px 20px;
  margin: 0;
}

@keyframes gradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.header {
  max-width: 1000px;
  margin: 0 auto 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
}

.header a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  transition: opacity 0.3s ease;
}

.header a:hover {
  opacity: 0.8;
}

button {
  padding: 12px 16px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
  font-family: 'Inter', sans-serif;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.box {
  max-width: 1000px;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  padding: 24px;
  border-radius: 15px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.box h3 {
  font-size: 22px;
  font-weight: 700;
  color: #000000;
  margin-top: 0;
  margin-bottom: 16px;
  font-family: 'Poppins', sans-serif;
}

.box > div:nth-child(2) {
  margin-bottom: 16px;
}

table {
  width: 100%;
  border-collapse: collapse;
}

table thead {
  background: #f9fafb;
  border-bottom: 2px solid #e5e7eb;
}

table th {
  padding: 12px;
  text-align: left;
  font-weight: 700;
  color: #000000;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

table td {
  padding: 12px;
  border-bottom: 1px solid #e5e7eb;
  color: #000000;
  font-size: 14px;
  font-weight: 500;
}

table tbody tr {
  transition: all 0.3s ease;
}

table tbody tr:hover {
  background: #f5f7ff;
}

#modal {
  display: none;
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.4);
  z-index: 1000;
}

#modal > div {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  padding: 32px;
  border-radius: 15px;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.2);
  animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(-10px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

#modal h4 {
  font-size: 20px;
  font-weight: 700;
  color: #000000;
  margin-bottom: 16px;
  font-family: 'Poppins', sans-serif;
}

#modal input,
#modal select {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 2px solid #e5e7eb;
  background: #f9fafb;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  transition: all 0.3s ease;
  color: #000000;
  font-weight: 500;
  margin-top: 6px;
}

#modal input::placeholder {
  color: #64748b;
}

#modal input:focus,
#modal select:focus {
  outline: none;
  border-color: #667eea;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

#modal > div > div:last-child {
  text-align: right;
  margin-top: 20px;
}

#modal button {
  margin-left: 8px;
}

@media (max-width: 768px) {
  .header {
    flex-direction: column;
    align-items: stretch;
  }

  body {
    padding: 20px 12px;
  }

  table {
    font-size: 12px;
  }

  table th,
  table td {
    padding: 8px;
  }
}
</style>
</head>
<body>
<div class="header"><a href="/index.html">← Dashboard</a><div><button onclick="logout()">Sign out</button></div></div>
<div class="box">
  <h3>Users</h3>
  <div style="margin-bottom:8px"><button onclick="openAdd()">+ Add User</button></div>
  <table id="tbl"><thead><tr><th>Username</th><th>Role</th><th>2FA</th><th>Actions</th></tr></thead><tbody></tbody></table>
</div>

<div id="modal">
  <div>
    <h4 id="mt">Add User</h4>
    <div><input id="u_name" placeholder="Username" /></div>
    <div><input id="u_pwd" placeholder="Password" /></div>
    <div style="margin-top:8px"><select id="u_role"><option value="user">user</option><option value="admin">admin</option></select></div>
    <div style="text-align:right;margin-top:20px"><button onclick="closeM()">Cancel</button><button onclick="save()">Save</button></div>
  </div>
</div>

<script>
const api = location.origin;
let token = localStorage.getItem('sl_token'); if(!token) location.href = '/login.html'; // changed
function authHeaders(){ const h={'Content-Type':'application/json'}; if(token) h['Authorization']='Bearer '+token; return h; }
function showToast(m){ alert(m); }

async function getUsers(){ const res=await fetch(api+'/users',{headers:authHeaders()}); if(res.status===401){ alert('Auth'); return } const list=await res.json(); const tbody=document.querySelector('#tbl tbody'); tbody.innerHTML=''; list.forEach(u=>{ const tr=document.createElement('tr'); const mfa = u.mfa_enabled ? 'Enabled' : 'Disabled'; tr.innerHTML=`<td>${escape(u.username)}</td><td>${escape(u.role||'user')}</td><td>${mfa}</td><td><button onclick="edit('${escape(u.username)}')">Edit</button> <button onclick="del('${encodeURIComponent(u.username)}')">Delete</button></td>`; tbody.appendChild(tr); }); }
function escape(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function openAdd(){ document.getElementById('mt').innerText='Add User'; document.getElementById('u_name').value=''; document.getElementById('u_pwd').value=''; document.getElementById('u_role').value='user'; document.getElementById('u_name').disabled=false; document.getElementById('modal').style.display='flex'; editing=null;}
function closeM(){ document.getElementById('modal').style.display='none'; }
let editing = null;
async function save(){ const username=document.getElementById('u_name').value; const pwd=document.getElementById('u_pwd').value; const role=document.getElementById('u_role').value; if(editing){ await fetch(api+'/users/'+encodeURIComponent(username),{method:'PUT',headers:authHeaders(),body:JSON.stringify({password:pwd||undefined,role})}); showToast('Updated') } else { await fetch(api+'/users',{method:'POST',headers:authHeaders(),body:JSON.stringify({username,password:pwd,role})}); showToast('Added') } closeM(); getUsers(); }
async function edit(username){ editing=username; document.getElementById('mt').innerText='Edit User'; document.getElementById('u_name').value=username; document.getElementById('u_name').disabled=true; document.getElementById('u_pwd').value=''; document.getElementById('modal').style.display='flex'; }
async function del(encoded){ if(!confirm('Delete user?')) return; const u=decodeURIComponent(encoded); await fetch(api+'/users/'+u,{method:'DELETE',headers:authHeaders()}); showToast('Deleted'); getUsers(); }
function logout(){ localStorage.removeItem('sl_token'); location.href = '/login.html'; } // changed
getUsers();
</script>
</body>
</html>
