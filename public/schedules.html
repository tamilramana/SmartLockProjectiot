<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Schedules — SmartLock</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<!-- Font Awesome 6 Free CDN (Primary) -->
<link rel="stylesheet" 
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
  integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" 
  crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Font Awesome 6 Free CDN (Backup) -->
<link rel="stylesheet" 
  href="https://use.fontawesome.com/releases/v6.4.0/css/all.css" 
  crossorigin="anonymous">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
  background-size: 400% 400%;
  animation: gradient 15s ease infinite;
  min-height: 100vh;
  padding: 32px 20px;
  margin: 0;
}

.fas, .far, .fab, .fa {
  font-family: "Font Awesome 6 Free" !important;
  font-weight: 900;
  -webkit-font-smoothing: antialiased;
  display: inline-block;
  font-style: normal;
  font-variant: normal;
  text-rendering: auto;
  line-height: 1;
}

@keyframes gradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.wrap {
  max-width: 1000px;
  margin: 0 auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 16px;
  flex-wrap: wrap;
}

.top > div:first-child {
  display: flex;
  gap: 12px;
  align-items: center;
  color: white;
  font-weight: 600;
}

.top a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  transition: opacity 0.3s ease;
}

.top a:hover {
  opacity: 0.8;
}

.top h3 {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  color: white;
}

button {
  padding: 12px 16px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
  font-family: 'Inter', sans-serif;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.box {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  padding: 24px;
  border-radius: 15px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hint {
  color: #64748b;
  font-size: 13px;
  margin-bottom: 16px;
  padding: 12px;
  background: #f9fafb;
  border-radius: 8px;
  border-left: 4px solid #667eea;
}

.sched {
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #e5e7eb;
  margin-bottom: 12px;
  transition: all 0.3s ease;
  background: #fafafa;
}

.sched:hover {
  border-color: #667eea;
  background: #f5f7ff;
  box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
}

.sched > div:first-child {
  font-weight: 700;
  color: #000000;
  margin-bottom: 6px;
}

.sched .muted-small {
  color: #64748b;
  font-size: 12px;
  margin-bottom: 8px;
}

.sched button {
  padding: 8px 12px;
  font-size: 12px;
  margin-top: 8px;
}

@media (max-width: 768px) {
  .top {
    flex-direction: column;
    align-items: stretch;
  }

  body {
    padding: 20px 12px;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><a href="/index.html">← Dashboard</a><h3 style="display:inline-block;margin-left:12px">Schedules</h3></div><div><button onclick="openScheduleForm()">+ Add</button> <button onclick="logout()">Sign out</button></div></div>
  <div class="box">
    <div style="margin-bottom:8px" class="hint">Time accepts ISO datetime (e.g. 2026-01-12T09:00) or cron expression. Next execution is approximate.</div>
    <div id="list"></div>
  </div>
</div>

<script>
const api = location.origin; let token = localStorage.getItem('sl_token'); if(!token) location.href = '/login.html'; 
function auth(){ const h={'Content-Type':'application/json'}; if(token) h['Authorization']='Bearer '+token; return h; }
function showToast(m){ alert(m); }
function escape(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function load(){ 
  const res=await fetch(api+'/schedules',{headers:auth()}); 
  const list=await res.json(); 
  const el=document.getElementById('list'); 
  el.innerHTML=''; 
  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  list.forEach(s=>{ 
    const days=Array.isArray(s.daysOfWeek)?s.daysOfWeek:[];
    const weekly=days.length?`${days.map(d=>dayNames[d]||d).join(', ')} @ ${String(s.hour||0).padStart(2,'0')}:${String(s.minute||0).padStart(2,'0')}`:null;
    const d=document.createElement('div'); 
    d.className='sched'; 
    d.innerHTML=`<div style="font-weight:700">${escape(s.action)} • ${escape(s.deviceId||'all')}</div><div class="muted-small">${escape(weekly||s.time||'N/A')} • id:${escape(s.id)}</div><div style="margin-top:8px"><button onclick="del('${encodeURIComponent(s.id)}')">Delete</button></div>`; 
    el.appendChild(d); 
  }); 
}
async function openScheduleForm(){
  const action = prompt('Action: lock or unlock', 'lock');
  if (action === null) return;
  if (!['lock','unlock'].includes(action)) { showToast('Action must be lock or unlock'); return; }
  const deviceIdInput = prompt('Device ID (leave empty for all devices)', '');
  if (deviceIdInput === null) return;
  const type = prompt('Schedule type: once or weekly', 'once');
  if (type === null) return;
  const payload = { deviceId: deviceIdInput || null, action };
  if (type.toLowerCase() === 'weekly') {
    const daysStr = prompt('Days of week (0=Sun..6=Sat) comma-separated', '1,2,3,4,5');
    if (!daysStr) { showToast('Days required'); return; }
    const days = daysStr.split(',').map(s=>parseInt(s.trim(),10)).filter(n=>Number.isFinite(n) && n>=0 && n<=6);
    if (!days.length) { showToast('Invalid days'); return; }
    const time = prompt('Time (HH:MM, 24h)', '09:00');
    if (!time || !/^\d{2}:\d{2}$/.test(time)) { showToast('Time required'); return; }
    const [h,m] = time.split(':');
    payload.daysOfWeek = days;
    payload.hour = parseInt(h, 10);
    payload.minute = parseInt(m, 10);
  } else {
    const time = prompt('Time (ISO datetime or cron)', '2026-01-12T09:00:00');
    if (!time) { showToast('Time required'); return; }
    payload.time = time;
  }
  const res = await fetch(api+'/schedules',{method:'POST',headers:auth(),body:JSON.stringify(payload)});
  if (!res.ok) {
    const err = await res.json().catch(()=>({}));
    showToast(err.error || 'Failed to add schedule');
    return;
  }
  showToast('Added');
  load();
}

async function add(){ return openScheduleForm(); }
async function del(id){ if(!confirm('Delete schedule?')) return; await fetch(api+'/schedules/'+decodeURIComponent(id),{method:'DELETE',headers:auth()}); showToast('Deleted'); load(); }
function logout(){ localStorage.removeItem('sl_token'); location.href = '/login.html' }
load();
</script>
</body></html>
