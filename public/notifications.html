<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — SmartLock</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<!-- Font Awesome 6 Free CDN (Primary) -->
<link rel="stylesheet" 
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" 
  integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" 
  crossorigin="anonymous" referrerpolicy="no-referrer" />
<!-- Font Awesome 6 Free CDN (Backup) -->
<link rel="stylesheet" 
  href="https://use.fontawesome.com/releases/v6.4.0/css/all.css" 
  crossorigin="anonymous">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
  background-size: 400% 400%;
  animation: gradient 15s ease infinite;
  min-height: 100vh;
  padding: 32px 20px;
  margin: 0;
}

@keyframes gradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.fas, .far, .fab, .fa {
  font-family: "Font Awesome 6 Free" !important;
  font-weight: 900;
  -webkit-font-smoothing: antialiased;
  display: inline-block;
  font-style: normal;
  font-variant: normal;
  text-rendering: auto;
  line-height: 1;
  pointer-events: none;
}

.wrap {
  max-width: 1000px;
  margin: 0 auto;
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  gap: 16px;
  flex-wrap: wrap;
}

.top a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  transition: opacity 0.3s ease;
}

.top a:hover {
  opacity: 0.8;
}

button {
  padding: 12px 16px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
  font-family: 'Inter', sans-serif;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

.box {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  padding: 24px;
  border-radius: 15px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.box > div:first-child {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}

#msg {
  padding: 12px 14px;
  border-radius: 10px;
  border: 2px solid #e5e7eb;
  background: #f9fafb;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  transition: all 0.3s ease;
  color: #000000;
  width: 100%;
  font-weight: 500;
  flex: 1;
}

#msg::placeholder {
  color: #64748b;
}

#msg:focus {
  outline: none;
  border-color: #667eea;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

select {
  padding: 12px 14px;
  border-radius: 10px;
  border: 2px solid #e5e7eb;
  background: #f9fafb;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  color: #000000;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
}

select:focus {
  outline: none;
  border-color: #667eea;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

.note {
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 12px;
  transition: all 0.3s ease;
  border-left: 4px solid;
}

.note.info {
  background: #f0f9ff;
  border-left-color: #38bdf8;
}

.note.warning {
  background: #fff7ed;
  border-left-color: #f59e0b;
}

.note.critical {
  background: #fff1f2;
  border-left-color: #ef4444;
}

.note > div:first-child {
  font-weight: 700;
  color: #000000;
  margin-bottom: 4px;
}

.note .muted-small {
  font-size: 12px;
  color: #64748b;
  margin-bottom: 6px;
}

.note > div:nth-child(3) {
  color: #000000;
  margin-top: 6px;
}

.note button {
  padding: 8px 12px;
  font-size: 12px;
  margin-top: 8px;
}

@media (max-width: 768px) {
  .top {
    flex-direction: column;
    align-items: stretch;
  }

  .box > div:first-child {
    flex-direction: column;
  }

  #msg {
    width: 100%;
  }

  body {
    padding: 20px 12px;
  }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><a href="/index.html">← Dashboard</a></div><div><button onclick="logout()"><i class="fas fa-right-from-bracket"></i> Sign out</button></div></div>
  <div class="box">
    <h3 style="margin-top:0; margin-bottom:16px; font-family:'Poppins', sans-serif;"><i class="fas fa-bell"></i> Notifications</h3>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:12px">
      <input id="msg" placeholder="Message" />
      <select id="lvl"><option value="info">Info</option><option value="warning">Warning</option><option value="critical">Critical</option></select>
      <button onclick="send()"><i class="fas fa-paper-plane"></i> Send</button>
      <button onclick="clearAll()"><i class="fas fa-trash-can"></i> Clear</button>
    </div>
    <div id="list"></div>
  </div>
</div>
<script>
const api = location.origin; let token = localStorage.getItem('sl_token'); if(!token) location.href = '/login.html';
function auth(){ const h={'Content-Type':'application/json'}; if(token) h['Authorization']='Bearer '+token; return h; }
function showToast(m){ alert(m); }
async function load(){ 
  const res = await fetch(api + '/notifications', { headers: auth() }); 
  const list = await res.json(); 
  const el=document.getElementById('list'); 
  el.innerHTML=''; 
  const icons = { info: 'fa-circle-info', warning: 'fa-triangle-exclamation', critical: 'fa-circle-xmark' };
  list.forEach(n=>{ 
    const div=document.createElement('div'); 
    div.className='note '+(n.level||'info'); 
    const icon = icons[n.level] || 'fa-bell';
    div.innerHTML=`<div style="font-weight:700"><i class="fas ${icon}"></i> ${escape(n.level.toUpperCase())}</div><div class="muted-small">${new Date(n.timestamp).toLocaleString()}</div><div style="margin-top:6px">${escape(n.message)}</div><div style="margin-top:8px"><button onclick="del('${encodeURIComponent(n.id)}')"><i class="fas fa-trash"></i> Delete</button></div>`; 
    el.appendChild(div); 
  }); 
}
async function send(){ const m=document.getElementById('msg').value; const l=document.getElementById('lvl').value; await fetch(api+'/notifications',{method:'POST',headers:auth(),body:JSON.stringify({message:m,level:l})}); showToast('Sent'); load(); }
async function del(id){ await fetch(api+'/notifications/'+decodeURIComponent(id),{method:'DELETE',headers:auth()}); showToast('Deleted'); load(); }
async function clearAll(){ if(!confirm('Clear all notifications?')) return; const list = await fetch(api + '/notifications', { headers: auth() }).then(r=>r.json()); for(const n of list){ await fetch(api + '/notifications/'+n.id, { method:'DELETE', headers: auth() }); } load(); }
function logout(){ localStorage.removeItem('sl_token'); location.href = '/login.html' }
load();
</script>
</body></html>
