<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">
<link rel="stylesheet" 
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/brands.min.css">
<title>Devices — SmartLock</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 25%, #f093fb 50%, #4facfe 75%, #00f2fe 100%);
  background-size: 400% 400%;
  animation: gradient 15s ease infinite;
  min-height: 100vh;
  padding: 32px 20px;
  margin: 0;
}

/* ── ICON FIX ── */
@import url('https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css');

i.fas, i.far, i.fab, i.fa-solid, i.fa-regular, i.fa-brands {
  font-family: "Font Awesome 6 Free" !important;
  font-weight: 900 !important;
  font-style: normal !important;
  display: inline-block !important;
  text-rendering: auto !important;
  -webkit-font-smoothing: antialiased !important;
}

i.fab {
  font-family: "Font Awesome 6 Brands" !important;
  font-weight: 400 !important;
}

/* Prevent broken box fallback and fix touch targets */
i[class*="fa-"] {
  pointer-events: none;
}

i[class*="fa-"]::before {
  display: inline-block;
  font-style: normal;
  font-variant: normal;
  text-rendering: auto;
  line-height: 1;
}

@keyframes gradient {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

.wrap {
  max-width: 1200px;
  margin: 0 auto;
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}

.topbar > div:first-child {
  display: flex;
  gap: 12px;
  align-items: center;
  color: white;
  font-weight: 600;
  font-size: 18px;
}

.topbar a {
  color: white;
  text-decoration: none;
  font-weight: 500;
  transition: opacity 0.3s ease;
}

.topbar a:hover {
  opacity: 0.8;
}

.topbar h3 {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  color: white;
}

.controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}

.search {
  padding: 12px 14px;
  border-radius: 10px;
  border: 2px solid #e5e7eb;
  background: rgba(255, 255, 255, 0.95);
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  transition: all 0.3s ease;
  color: #000000;
  width: 340px;
}

.search::placeholder {
  color: #64748b;
}

.search:focus {
  outline: none;
  border-color: #667eea;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}

button {
  padding: 12px 16px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: white;
  font-weight: 700;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
  font-family: 'Inter', sans-serif;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
}

button:active {
  transform: translateY(0);
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
  animation: fadeIn 0.6s ease-out;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.card {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  padding: 20px;
  border-radius: 15px;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  transition: all 0.3s ease;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
}

.card > div:first-child {
  font-weight: 700;
  font-size: 16px;
  color: #000000;
  margin-bottom: 8px;
}

.meta {
  color: #64748b;
  font-size: 13px;
  margin-bottom: 12px;
  font-weight: 500;
}

.card > div:nth-child(3) {
  margin-top: 12px;
}

.card span {
  display: inline-block;
  padding: 6px 12px;
  border-radius: 8px;
  color: white;
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
}

.card button {
  padding: 8px 12px;
  font-size: 12px;
  margin-right: 6px;
  margin-top: 10px;
}

@media (max-width: 768px) {
  .topbar {
    flex-direction: column;
    align-items: stretch;
  }

  .controls {
    flex-direction: column;
  }

  .search {
    width: 100%;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  body {
    padding: 20px 12px;
  }
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, 0.4);
  z-index: 1000;
}

.modal .box {
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(10px);
  padding: 32px;
  border-radius: 15px;
  width: 90%;
  max-width: 420px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
  border: 1px solid rgba(255, 255, 255, 0.2);
  animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: scale(0.95) translateY(-10px);
  }
  to {
    opacity: 1;
    transform: scale(1) translateY(0);
  }
}

.modal h4 {
  font-size: 20px;
  font-weight: 700;
  color: #000000;
  margin-bottom: 16px;
  font-family: 'Poppins', sans-serif;
}

.modal input {
  width: 100%;
  padding: 12px 14px;
  border-radius: 10px;
  border: 2px solid #e5e7eb;
  background: #f9fafb;
  font-size: 14px;
  font-family: 'Inter', sans-serif;
  transition: all 0.3s ease;
  color: #000000;
  font-weight: 500;
  margin-top: 6px !important;
}

.modal input::placeholder {
  color: #64748b;
}

.modal input:focus {
  outline: none;
  border-color: #667eea;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div style="display:flex;gap:12px;align-items:center">
      <a href="/index.html">← Dashboard</a>
      <h3 style="margin:0">Devices</h3>
    </div>
    <div class="controls">
      <input id="devSearch" class="search" placeholder="Search devices..." oninput="devFilter()" />
      <button onclick="openAdd()">+ Add</button>
      <button onclick="bulkLock()">Lock All</button>
      <button onclick="bulkUnlock()">Unlock All</button>
    </div>
  </div>

  <div id="devices" class="grid"></div>
</div>

<div class="modal" id="modal">
  <div class="box">
    <h4 id="modalTitle">Add Device</h4>
    <div><input id="d_id" placeholder="Device ID" style="width:100%;padding:8px;margin-top:6px"></div>
    <div><input id="d_name" placeholder="Name" style="width:100%;padding:8px;margin-top:6px"></div>
    <div><input id="d_loc" placeholder="Location" style="width:100%;padding:8px;margin-top:6px"></div>
    <div style="margin-top:10px;text-align:right">
      <button onclick="closeModal()">Cancel</button>
      <button onclick="saveDevice()">Save</button>
    </div>
  </div>
</div>

<script>
const api = location.origin;
let token = localStorage.getItem('sl_token');
if(!token) location.href = '/login.html';

function authHeaders(){ const h={'Content-Type':'application/json'}; if(token) h['Authorization']='Bearer '+token; return h; }
function showToast(m){ alert(m); }

let allDevices = [];
async function getDevices(){
  const res = await fetch(api + '/devices', { headers: authHeaders() });
  allDevices = await res.json();
  render(allDevices);
}
function render(list){
  const el = document.getElementById('devices'); el.innerHTML='';
  if(!list || !list.length){ el.innerHTML='<div class="meta">No devices</div>'; return; }
  list.forEach(d=>{
    const div=document.createElement('div'); div.className='card';
    const lockBtnText = d.status==='locked' ? 'Unlock' : 'Lock';
    const lockBtnColor = d.status==='locked' ? 'background:#16a34a' : 'background:#ef4444';
    div.innerHTML=`<div style="font-weight:700">${escape(d.name)}</div><div class="meta">${escape(d.deviceId)} • ${escape(d.location||'—')}</div><div style="margin-top:8px"><span style="padding:6px 10px;border-radius:999px;background:${d.status==='locked'?'#ef4444':'#16a34a'};color:#fff;font-weight:700">${(d.status||'unknown').toUpperCase()}</span></div><div style="margin-top:10px"><button onclick="toggle('${encodeURIComponent(d.id||d.deviceId)}')" style="${lockBtnColor}">${lockBtnText}</button> <button onclick="edit('${encodeURIComponent(d.id||d.deviceId)}')"><i class="fas fa-pen-to-square"></i> Edit</button> <button onclick="del('${encodeURIComponent(d.id||d.deviceId)}')"><i class="fas fa-trash"></i> Delete</button></div>`;
    el.appendChild(div);
  });
}
function devFilter(){ const q=(document.getElementById('devSearch').value||'').toLowerCase(); render(allDevices.filter(d=> (d.name||'').toLowerCase().includes(q) || (d.deviceId||'').toLowerCase().includes(q) || (d.location||'').toLowerCase().includes(q))); }
async function bulkLock(){ if(!confirm('Lock all devices?')) return; await fetch(api + '/lock', { method:'POST', headers: authHeaders() }); getDevices(); }
async function bulkUnlock(){ if(!confirm('Unlock all devices?')) return; await fetch(api + '/unlock', { method:'POST', headers: authHeaders() }); getDevices(); }

function escape(s){ return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function openAdd(){ document.getElementById('modalTitle').innerText='Add Device'; document.getElementById('d_id').value=''; document.getElementById('d_name').value=''; document.getElementById('d_loc').value=''; document.getElementById('modal').style.display='flex'; editing=null; }
function closeModal(){ document.getElementById('modal').style.display='none'; }
let editing = null;
async function saveDevice() {
  const payload = { deviceId: document.getElementById('d_id').value, name: document.getElementById('d_name').value, location: document.getElementById('d_loc').value };
  if(editing){
    await fetch(api + '/devices/' + editing, { method:'PUT', headers: authHeaders(), body: JSON.stringify(payload) });
    showToast('Updated');
  } else {
    await fetch(api + '/devices', { method:'POST', headers: authHeaders(), body: JSON.stringify(payload) });
    showToast('Added');
  }
  closeModal(); getDevices();
}
async function edit(encoded){ const id = decodeURIComponent(encoded); const res = await fetch(api + '/devices/' + id, { headers: authHeaders() }); const d = await res.json(); editing = id; document.getElementById('modalTitle').innerText='Edit Device'; document.getElementById('d_id').value = d.deviceId||d.id||''; document.getElementById('d_name').value = d.name||''; document.getElementById('d_loc').value = d.location||''; document.getElementById('modal').style.display='flex'; }
async function del(encoded){ if(!confirm('Delete?')) return; const id=decodeURIComponent(encoded); await fetch(api + '/devices/' + id, { method:'DELETE', headers: authHeaders() }); showToast('Deleted'); getDevices(); }
async function toggle(encoded){ 
  const id=decodeURIComponent(encoded); 
  try {
    const res=await fetch(api + '/devices/' + id, { headers: authHeaders() }); 
    const d=await res.json(); 
    const s = (d.status==='locked')?'unlocked':'locked'; 
    const endpoint = s === 'locked' ? '/devices/' + id + '/lock' : '/devices/' + id + '/unlock';
    const lockRes = await fetch(api + endpoint, { method:'POST', headers: authHeaders() });
    if(!lockRes.ok) {
      const err = await lockRes.json();
      showToast('Error: ' + (err.error || 'Failed to change lock status'));
      return;
    }
    showToast('Device ' + s); 
    getDevices();
  } catch(e) {
    showToast('Error: ' + e.message);
  }
}

function logout(){ localStorage.removeItem('sl_token'); location.href = '/login.html'; }

getDevices();
</script>

<script>
// Icon load checker - runs after page loads
window.addEventListener('load', function() {
  // Test if Font Awesome loaded correctly
  const testIcon = document.createElement('i');
  testIcon.className = 'fas fa-check';
  testIcon.style.position = 'absolute';
  testIcon.style.opacity = '0';
  document.body.appendChild(testIcon);
  
  const computed = window.getComputedStyle(testIcon, '::before');
  const content = computed.getPropertyValue('content');
  
  if (!content || content === 'none' || content === '') {
    // FA not loaded — inject backup CDN
    const backup = document.createElement('link');
    backup.rel = 'stylesheet';
    backup.href = 'https://use.fontawesome.com/releases/v6.5.1/css/all.css';
    document.head.appendChild(backup);
    console.warn('Font Awesome CDN failed — backup loaded');
  }
  document.body.removeChild(testIcon);
});
</script>

</body>
</html>
